    <script>
      // Apply the saved theme before first paint (no light/dark flash).
      try {
        var t = (JSON.parse(localStorage.getItem('geobingo:v2')) || {}).settings; // STORAGE_KEY in lib/store.ts
        t = (t && t.theme) || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
      // Start-up watchdog: main.tsx calls __bootDone() once the app has drawn its first screen. If that hasn't
      // happened after 8 s (a file that didn't load, an error while starting), the splash says so — with the error —
      // and offers "Try again" instead of sitting there forever. Errors before then are collected here.
      (function () {
        var errs = [], done = false;
        function note(m) { if (m && errs.length < 4) errs.push(String(m).slice(0, 200)); }
        addEventListener('error', function (e) {
          var t = e.target;
          note(t && t !== window && (t.src || t.href) ? 'Could not load ' + String(t.src || t.href).split('/').pop() : e.message);
        }, true);
        addEventListener('unhandledrejection', function (e) { var r = e.reason; note(r && r.message ? r.message : r); });
        window.__bootDone = function () { done = true; };
        setTimeout(function () {
          var boot = document.getElementById('boot');
          if (done || !boot) return;
          var de = false;
          try { de = ((JSON.parse(localStorage.getItem('geobingo:v2')) || {}).settings || {}).lang === 'de'; } catch (e) {}
          var box = document.createElement('div');
          box.className = 'boot-fail';
          var p = document.createElement('p');
          p.textContent = de ? 'geobingo startet nicht.' : 'geobingo didn\u2019t start.';
          var small = document.createElement('small');
          small.textContent = (errs.join(' \u00b7 ') || (de ? 'Keine Fehlermeldung' : 'No error message')) + (navigator.onLine ? '' : de ? ' (offline)' : ' (offline)');
          var btn = document.createElement('button');
          btn.textContent = de ? 'Nochmal versuchen' : 'Try again';
          btn.onclick = function () { location.reload(); };
          box.appendChild(p); box.appendChild(small); box.appendChild(btn);
          boot.querySelector('.boot-below').appendChild(box);
        }, 8000);
      })();
    </script>
